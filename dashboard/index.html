<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)" />
    <title>ReadyFor · Surgery readiness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body>
    <section id="auth-root" aria-live="polite"></section>
    <div class="app-shell" hidden>
    <header class="topbar">
      <a class="brand" href="/" aria-label="ReadyFor home">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6" /><path d="M7 12.5l3.2 3.2L17 8.8" /></svg>
        <span>ReadyFor</span>
      </a>
      <span class="topbar-sep" aria-hidden="true"></span>
      <span class="clinic" id="clinic">Northstar Surgical Center</span>
      <div class="topbar-right">
        <span class="mode" id="mode" title="Core service status"><i></i><span>Connecting</span></span>
        <button class="ghost-button" id="reset-demo" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-refresh" /></svg>Reset demo
        </button>
        <span class="staff" id="staff" title="Signed-in staff member"><span class="staff-avatar">DS</span><span class="staff-name">Demo staff</span><span class="staff-role">Admin</span></span>
        <button class="ghost-button" id="staff-signout" type="button" hidden>Sign out</button>
      </div>
    </header>

    <main class="layout">
      <section class="board" aria-labelledby="board-title">
        <div class="board-head">
          <div>
            <p class="kicker" id="today"></p>
            <h1 id="board-title">Surgery readiness</h1>
            <p class="board-summary" id="board-summary">Loading surgeries…</p>
          </div>
        </div>

        <section class="urgent" id="urgent" aria-label="Urgent alerts" aria-live="assertive" hidden></section>

        <figure class="runway" aria-labelledby="runway-caption">
          <figcaption id="runway-caption"><span>Next 14 days</span><span class="legend"><i class="dot risk"></i>At risk<i class="dot attention"></i>Needs attention<i class="dot ready"></i>Ready</span></figcaption>
          <div class="runway-track" id="runway"></div>
        </figure>

        <div class="list-head">
          <div class="view-heading"><h2 id="list-title">Upcoming surgeries</h2><button type="button" class="ghost-button" id="view-toggle" data-view-toggle aria-pressed="false">My tasks</button></div>
          <div class="segmented" role="radiogroup" aria-label="Filter by readiness" id="filters"></div>
        </div>
        <div class="task-filters" id="task-filters" hidden><label>Owner<select id="task-owner"><option value="">All owners</option><option value="coordinator">Coordinator</option><option value="nurse">Nurse</option><option value="surgeon">Surgeon</option><option value="patient">Patient</option></select></label><label>Status<select id="task-status"><option value="open">Open</option><option value="done">Done</option><option value="all">All</option></select></label></div><div class="my-task-list" id="my-task-list" aria-live="polite" hidden></div><div class="surgery-list" id="surgery-list" aria-live="polite"></div>
        <p class="footnote">Synthetic demo data. Readiness follows documented rules; every clinical decision is made by staff.</p>
      </section>

      <aside class="case" id="case" aria-label="Selected surgery"></aside>
    </main>

    <dialog class="dialog" id="dialog">
      <form method="dialog">
        <h3 id="dialog-title"></h3>
        <p id="dialog-body"></p>
        <div class="dialog-actions">
          <button class="ghost-button" value="cancel">Cancel</button>
          <button class="primary-button" value="confirm" id="dialog-confirm">Confirm</button>
        </div>
      </form>
    </dialog>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16m0 4v-4h-4" /></symbol>
        <symbol id="i-lab" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6.5L4.8 18.2A2 2 0 0 0 6.5 21h11a2 2 0 0 0 1.7-2.8L14 9.5V3M7.5 15h9" /></symbol>
        <symbol id="i-medication" viewBox="0 0 24 24"><path d="M10.5 20.5a5 5 0 0 1-7-7l6-6a5 5 0 0 1 7 7l-6 6zM8.5 8.5l7 7" /></symbol>
        <symbol id="i-logistics" viewBox="0 0 24 24"><path d="M5 17h14M6 17l1.5-6.5A2 2 0 0 1 9.4 9h5.2a2 2 0 0 1 1.9 1.5L18 17M5 17v2M19 17v2M8 14h.01M16 14h.01" /></symbol>
        <symbol id="i-instruction" viewBox="0 0 24 24"><path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1zM8 5H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2M9 12h6M9 16h4" /></symbol>
        <symbol id="i-health" viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6" /></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 8v5M12 16.5h.01M10.3 3.9L2.6 17.5A2 2 0 0 0 4.3 20.5h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" /></symbol>
        <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3L10 14M21 3l-6.5 18-3.5-7-7-3.5L21 3z" /></symbol>
        <symbol id="i-clip" viewBox="0 0 24 24"><path d="M20.5 11.5l-8.4 8.4a5 5 0 0 1-7-7l8.4-8.4a3.3 3.3 0 0 1 4.7 4.7l-8.4 8.4a1.7 1.7 0 0 1-2.4-2.4l7.8-7.7" /></symbol>
        <symbol id="i-calendar" viewBox="0 0 24 24"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" /></symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      </defs>
    </svg>
    <script src="/config.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
